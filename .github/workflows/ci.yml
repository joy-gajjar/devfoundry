name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate TUI terminal contract
        run: cargo test -p devfoundry-tui --all-targets

  macos:
    name: macOS smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --target aarch64-apple-darwin
      - run: cargo test --workspace
      - name: Validate TUI terminal contract
        run: cargo test -p devfoundry-tui --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release --target aarch64-apple-darwin -p devfoundry

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate TUI terminal contract
        run: cargo test -p devfoundry-tui --all-targets
      - name: Verify Windows Job Object descendant cleanup
        run: cargo test -p devfoundry-tools command_timeout_kills_descendants_in_job_object -- --nocapture
