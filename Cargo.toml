[workspace]
resolver = "2"
members = [
    "crates/schema",
    "crates/protocol",
    "crates/storage",
    "crates/tools",
    "crates/llm",
    "crates/core",
    "crates/server",
    "crates/tui",
    "crates/devfoundry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite", "tls-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
ulid = { version = "1", features = ["serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
